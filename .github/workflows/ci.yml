name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check src seed eval tests
      - name: Unit tests (no API key required)
        run: pytest

  eval-gate:
    # Runs the real agent against a subset of the golden set. Skips cleanly if
    # the GROQ_API_KEY secret is not configured, so forks/PRs don't fail.
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate sample data
        run: python seed/generate_data.py --scale small
      - name: Run eval gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "No GROQ_API_KEY secret set - skipping LLM eval."
            exit 0
          fi
          python eval/run_eval.py --subset 8
      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scorecard
          path: eval/reports/
          if-no-files-found: ignore
